<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Rock Paper Scissors</h1>

    <button class="move-button js-rock">
      <img src="images/rock-emoji.png" class="emoji" />
    </button>

    <button class="move-button js-paper">
      <img src="images/paper-emoji.png" class="emoji" />
    </button>

    <button class="move-button js-scissor">
      <img src="images/scissor-emoji.png" class="emoji" />
    </button>

    <p class="result js-result"></p>
    <p class="js-moves"></p>
    <p class="score js-score"></p>

    <button class="control-button js-reset">Reset Score</button>
    <button class="control-button js-auto">Auto Play</button>

    <script src="script.js"></script>
  </body>
</html>
